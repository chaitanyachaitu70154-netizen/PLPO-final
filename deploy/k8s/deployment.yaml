apiVersion: apps/v1
kind: Deployment
metadata:
  name: plpo-deployment
  namespace: plpo-production
  labels:
    app.kubernetes.io/name: plpo
    app.kubernetes.io/part-of: personalized-learning-path-optimizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plpo
  template:
    metadata:
      labels:
        app: plpo
    spec:
      containers:
        - name: plpo-app
          image: ghcr.io/yourorg/plpo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: plpo-config
            - secretRef:
                name: plpo-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
